apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: sterling-devops-deploy
  namespace: default
spec:
  params:
    - default: 'false'
      description: 'IBM entitlement key. If not set, will use secret manager.'
      name: ibm-entitlement-key
      type: string
  tasks:
    - name: get-ibm-entitlement-key
      params:
        - name: KEY_ID
          value: 968d7819-f2c5-7b67-c420-3c6bfd51521e
        - name: SECRETS_MANAGER_ENDPOINT_URL
          value: 'https://afa20521-cd75-4864-843f-e59fd0ffd49d.us-south.secrets-manager.appdomain.cloud'
      retries: 2
      taskRef:
        kind: Task
        name: ibmcloud-secrets-manager-get
      when:
        - input: $(params.ibm-entitlement-key)
          operator: in
          values:
            - 'false'
    - name: set-ibm-entitlement-key
      params:
        - name: ibm-entitlement-key
          value: $(params.ibm-entitlement-key)
      retries: 3
      runAfter:
        - get-ibm-entitlement-key
      taskSpec:
        metadata: {}
        params:
          - name: ibm-entitlement-key
            type: string
        results:
          - description: The resolved entitlement key
            name: effective-entitlement-key
            type: string
        spec: null
        steps:
          - computeResources: {}
            image: 'quay.io/devfile/universal-developer-image:latest'
            name: echo-entitlement-key
            script: |
              #!/usr/bin/env bash
              set -e
              if [ "$(params.ibm-entitlement-key)" == "false" ]; then
                echo "Using TechZone provided entitlement key"
                echo -n "$(tasks.get-ibm-entitlement-key.results.secret-value)" > $(results.effective-entitlement-key.path)
              else
                echo "Using user provided entitlement key"
                echo -n "$(params.ibm-entitlement-key)" > $(results.effective-entitlement-key.path)
              fi
    - name: b2bi-install
      runAfter:
        - set-ibm-entitlement-key
      taskSpec:
        metadata: {}
        spec: null
        steps:
          - computeResources: {}
            image: 'quay.io/kishorec/sde:latest'
            name: install-b2bi
            script: |
              #!/bin/bash
              set -e

              export ENTITLED_REGISTRY_KEY="$(tasks.set-ibm-entitlement-key.results.effective-entitlement-key)"
              export ANSIBLE_CONFIG=./ansible.cfg

              export SI_INSTANCEID=dev01
              export SI_VERSION=6.2.1.1

              echo "Cloning Sterling automation repository"
              git clone https://github.com/ckpkishore/ansible-ibm-sterling.git
              cd ansible-ibm-sterling

              ls -ltr

              # Set Helm version
              HELM_VERSION=v3.18.3

              # Download and extract Helm
              curl -fsSL -o helm.tar.gz https://get.helm.sh/helm-${HELM_VERSION}-linux-amd64.tar.gz
              tar -zxvf helm.tar.gz

              # Move helm binary to a local bin directory (e.g., /workspace/bin) and add to PATH
              mkdir -p /workspace/bin
              mv linux-amd64/helm /workspace/bin/helm
              chmod +x /workspace/bin/helm

              # Add it to PATH
              export PATH="/workspace/bin:$PATH"

              # Verify installation
              helm version

              echo "Running B2BI install via Ansible..."
              ansible-playbook playbooks/deploy_sb2b.yml
              echo "B2BI Ansible playbook finished"
    - name: sterling-import-resources
      runAfter:
        - b2bi-install
      taskSpec:
        params:
          - name: pod-name
            default: s0-b2bi-asi-server-0
          - name: namespace
            default: ibm-b2bi-dev01-app
          - name: secret-name
            default: si-system-passphrase-secret
          - name: secret-key
            default: SYSTEM_PASSPHRASE

        volumes:
          - name: import-data
            emptyDir: {}

        steps:
          # =====================================================
          # STEP 1: Download & unzip artifacts
          # =====================================================
          - name: download-artifacts
            image: quay.io/kishorec/sde:latest
            volumeMounts:
              - name: import-data
                mountPath: /workspace/data
            workingDir: /workspace/data
            script: |
              #!/usr/bin/env bash
              set -e

              echo "Downloading Sterling artifacts..."

              curl -sSL -o TXExportConfig.xml \
                https://raw.githubusercontent.com/ckpkishore/sde/refs/heads/main/sfg/TXExportConfig.xml

              curl -sSL -o customer_overrides.properties \
                https://raw.githubusercontent.com/ckpkishore/sde/refs/heads/main/sfg/customer_overrides.properties

              curl -sSL -o IBM_SDE_Troubleshooting_Agent.ipynb \
                https://raw.githubusercontent.com/ckpkishore/sde/refs/heads/main/notebook/IBM_SDE_Troubleshooting_Agent.ipynb

              curl -sSL -o sfgSFTPDemoScenario.xml \
                https://raw.githubusercontent.com/Knickkennedy/ibm-sterling-automation/36eea647f7ceba2624df44b91e46c29f61a940a9/roles/sb2bi_scenario_sftp/files/sfgSFTPDemoScenario.xml

              curl -sSL -o PGP_DEMO_export.xml \
                https://raw.githubusercontent.com/Knickkennedy/ibm-sterling-automation/36eea647f7ceba2624df44b91e46c29f61a940a9/roles/sb2bi_scenario_sftp/files/PGP_DEMO_export.xml

              echo "Downloading Level 3 demo data..."
              curl -sSL -o B2BiLevel3ImportsAndData.zip \
                https://raw.githubusercontent.com/IBM/SalesEnablement-SterlingDataExchange-V2-L3/refs/heads/main/tools/B2BiLevel3ImportsAndData.zip

              unzip -q B2BiLevel3ImportsAndData.zip

              echo "Artifacts staged:"
              ls -R .

          # =====================================================
          # STEP 2: Import into B2BI
          # =====================================================
          - name: import-into-b2bi
            image: quay.io/openshift/origin-cli:4.15
            volumeMounts:
              - name: import-data
                mountPath: /workspace/data
            workingDir: /workspace/data
            script: |
              #!/usr/bin/env bash
              set -e

              echo "Extracting SYSTEM_PASSPHRASE..."
              SYSTEM_PASSPHRASE=$(oc get secret -n $(params.namespace) "$(params.secret-name)" \
                -o "jsonpath={.data.$(params.secret-key)}" | base64 -d)

              import_xml () {
                FILE=$1
                PASSPHRASE=$2
                BASENAME=$(basename "$FILE")

                echo "→ Importing $BASENAME"

                oc cp "$FILE" \
                  $(params.namespace)/$(params.pod-name):/tmp/$BASENAME

                oc exec -n $(params.namespace) $(params.pod-name) -- bash -c \
                  "/ibm/b2bi/install/tp_import/import.sh \
                  -input /tmp/$BASENAME \
                  -passphrase '$PASSPHRASE' \
                  -update -errors errors.txt"
              }

              import_xml TXExportConfig.xml "$SYSTEM_PASSPHRASE"
              import_xml sfgSFTPDemoScenario.xml "$SYSTEM_PASSPHRASE"
              import_xml PGP_DEMO_export.xml "$SYSTEM_PASSPHRASE"
              echo import_xml B2BiLevel3ImportsAndData/Demo01/Import/ExportPassthroughLab01.xml "password"
              import_xml B2BiLevel3ImportsAndData/Demo02/Allconfig/Lab02_All_Import.xml "password"
              import_xml B2BiLevel3ImportsAndData/Demo03/Import/Lab03-Export.xml "password"
              import_xml B2BiLevel3ImportsAndData/Demo04/Import/SFG-Lab4-Export.xml "password"

              echo "Updating configmap..."
              oc create configmap s0-b2bi-config-property \
                --from-file=customer_overrides.properties \
                -n $(params.namespace) \
                --dry-run=client -o yaml | oc apply -f -

              echo "Copying troubleshooting notebook..."
              oc cp IBM_SDE_Troubleshooting_Agent.ipynb \
                $(params.namespace)/$(params.pod-name):/tmp/IBM_SDE_Troubleshooting_Agent.ipynb

              echo "✅ Sterling imports completed successfully"
    - name: sterling-restart
      runAfter:
        - sterling-import-resources
      taskSpec:
        params:
          - name: pod-name
            description: Name of the target pod
            default: s0-b2bi-asi-server-0
          - name: namespace
            description: Namespace of SFG
            default: ibm-b2bi-dev01-app
        steps:
          - name: stop-start
            image: quay.io/openshift/origin-cli:4.15
            script: |
              #!/bin/sh
              set -e

              echo "Stopping the application..."
              oc scale statefulset s0-b2bi-ac-server --replicas=0 -n $(params.namespace)
              oc scale statefulset s0-b2bi-api-server --replicas=0 -n $(params.namespace)
              oc scale statefulset s0-b2bi-asi-server --replicas=0 -n $(params.namespace)
              echo "Application stopped"

              echo "Starting the application..."
              oc scale statefulset s0-b2bi-ac-server --replicas=1 -n $(params.namespace)
              oc scale statefulset s0-b2bi-api-server --replicas=1 -n $(params.namespace)
              oc scale statefulset s0-b2bi-asi-server --replicas=1 -n $(params.namespace)

              NAMESPACE="$(params.namespace)"
              LABEL="statefulset.kubernetes.io/pod-name=$(params.pod-name)"


              # Step 1: Wait until the pod exists
              echo "Waiting for pod to be created..."
              until oc get pod -l "$LABEL" -n "$NAMESPACE" --no-headers 2>/dev/null | grep -q .; do
                sleep 120
              done

              # Step 2: Get the actual pod name
              POD_NAME=$(oc get pod -l "$LABEL" -n "$NAMESPACE" -o jsonpath='{.items[0].metadata.name}')

              # Step 3: Wait until the pod becomes ready
              echo "Pod found: $POD_NAME"
              until [ "$(oc get pod "$POD_NAME" -n "$NAMESPACE" -o jsonpath='{.status.containerStatuses[0].ready}' 2>/dev/null)" = "true" ]; do
                echo "Waiting for pod to become ready..."
                sleep 120
              done

              echo "Pod $POD_NAME is ready."

              echo "Application started"
